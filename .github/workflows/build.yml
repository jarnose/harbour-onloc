name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same script a developer runs: both language modes, -Werror.
      # The vector-tile test's golden fixture is a real capture and is not in
      # the repository; it reports itself skipped.
      - name: Run the Qt-free test suites
        run: tests/run.sh

      # Catches what a C++ build cannot and a phone shows as a blank page:
      # duplicate signal handlers, ES6 syntax the Qt 5.6 QML engine rejects.
      - name: Check the QML
        run: python3 tools/check_qml.py

      # Every qsTr()/tr() must have its Finnish text, and the catalogue must
      # have no unfinished entries. No line numbers in the files, so an edit
      # only makes this fail when a string really changed.
      - name: Check the translations
        run: |
          sudo apt-get update && sudo apt-get install -y qttools5-dev-tools
          export PATH=/usr/lib/x86_64-linux-gnu/qt5/bin:$PATH
          lupdate -locations none -no-obsolete src qml \
              -ts translations/harbour-onloc.ts translations/harbour-onloc-fi.ts
          git diff --exit-code -- translations
          lrelease translations/harbour-onloc-fi.ts -qm /tmp/fi.qm | grep "0 unfinished"

  rpm:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # aarch64 is what this is developed and tested on; armv7hl covers
        # the older devices and is built blind.
        arch: [aarch64, armv7hl]
    steps:
      - uses: actions/checkout@v4

      # The background service, from the same tree with the application
      # switched off (daemon/onloc-daemon.spec passes -DBUILD_APP=OFF
      # -DBUILD_DAEMON=ON).
      #
      # The action below cannot build it: its docker.sh runs a bare
      # `mb2 build` with no way to name a SPEC file. So the same image is
      # driven directly. The SPEC is swapped in rather than selected with a
      # flag: mb2 picks the one SPEC in rpm/, so putting the daemon's there
      # and taking the application's away is exactly as good as a flag. It
      # happens inside a throwaway copy in the container; the checkout is
      # untouched, which is why the daemon's SPEC can stay out of rpm/ where
      # sfdk and Qt Creator need it to be.
      - name: Build the daemon RPM
        run: |
          mkdir -p RPMS
          sudo chmod a+w RPMS
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            coderus/sailfishos-platform-sdk:5.1.0.11 \
            /bin/bash -euxc '
              mkdir -p /home/deploy/build && cd /home/deploy/build
              cp -r /workspace/* .
              rm -f rpm/*.spec
              cp daemon/onloc-daemon.spec rpm/
              mb2 -t SailfishOS-5.1.0.11-${{ matrix.arch }} build
              cp RPMS/*.rpm /workspace/RPMS/
            '

      - name: Build the application RPM
        uses: coderus/github-sfos-build@sfos5
        with:
          release: 5.1.0.11
          arch: ${{ matrix.arch }}

      # One of each, by name: a build that quietly produced only one of the
      # two packages is not a release.
      - name: Check both packages were built
        run: |
          ls -l RPMS
          for p in harbour-onloc onloc-daemon; do
            set -- RPMS/$p-[0-9]*.rpm
            test -f "$1" || { echo "no $p RPM"; exit 1; }
            test $# -eq 1 || { echo "expected one $p RPM, got $#: $*"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: RPMS/*.rpm
          if-no-files-found: error

  release:
    # A tag v<version> publishes the RPMs. One architecture failing does not stop the other
    # from being published, but nothing is published when both fail.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.tests.result == 'success' && needs.rpm.result != 'cancelled' }}
    needs: [tests, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The tag, both specs' Version, the daemon's version string and the
      # CHANGELOG have to agree.
      - name: Check the version
        run: tools/check_version.sh "${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          merge-multiple: true
          path: rpms

      - name: Notes and checksums
        run: |
          ls rpms/*.rpm
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          {
            echo
            echo "Unsigned RPMs built by GitHub Actions for Sailfish OS 5.1.0.11 (aarch64: current phones;"
            echo "armv7hl: older ones, built but not tested)."
            echo
            echo "- \`harbour-onloc\` - the application."
            echo "- \`onloc-daemon\` - the optional background service: reporting with the app closed, and"
            echo "  ring / lock / flash from the server. Install it as well to use *Run in the background*."
            echo
            echo "Install with \`devel-su pkcon install-local <file>.rpm\`, which warns that the package is"
            echo "untrusted. It is right: these are CI builds, not Store packages."
            echo
            echo "SHA-256:"
            echo '```'
            (cd rpms && sha256sum *.rpm)
            echo '```'
          } >> notes.md
          (cd rpms && sha256sum *.rpm > SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          name: OnLoc ${{ github.ref_name }}
          body_path: notes.md
          files: |
            rpms/*.rpm
            rpms/SHA256SUMS
